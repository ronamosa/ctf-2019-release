version: '3.8'

# BSidesSF 2019 CTF - Complete Deployment
# This docker-compose file deploys:
# - CTFd platform (user management, scoreboard, flag submission)
# - All challenge containers
# - File server for downloadable challenges

services:
  # ============================================
  # CTF PLATFORM (CTFd)
  # ============================================

  ctfd:
    image: ctfd/ctfd:latest
    container_name: ctf-platform
    restart: always
    ports:
      - "8000:8000"
    environment:
      - UPLOAD_FOLDER=/var/uploads
      - DATABASE_URL=mysql+pymysql://ctfd:ctfd@db/ctfd
      - REDIS_URL=redis://cache:6379
      - WORKERS=4
      - LOG_FOLDER=/var/log/CTFd
      - ACCESS_LOG=-
      - ERROR_LOG=-
      - REVERSE_PROXY=true
    volumes:
      - ctfd_logs:/var/log/CTFd
      - ctfd_uploads:/var/uploads
    depends_on:
      - db
      - cache
    networks:
      - ctf-network
      - challenge-network

  db:
    image: mariadb:10.11
    container_name: ctf-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=ctfd_root_password
      - MYSQL_USER=ctfd
      - MYSQL_PASSWORD=ctfd
      - MYSQL_DATABASE=ctfd
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ctf-network
    command: [mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --wait_timeout=28800, --log-warnings=0]

  cache:
    image: redis:7-alpine
    container_name: ctf-cache
    restart: always
    networks:
      - ctf-network

  # ============================================
  # FILE SERVER (for downloadable challenges)
  # ============================================

  fileserver:
    image: nginx:alpine
    container_name: ctf-fileserver
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./distfiles:/usr/share/nginx/html:ro
      - ./nginx-files.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ctf-network

  # ============================================
  # BINARY EXPLOITATION CHALLENGES
  # ============================================

  runit:
    build:
      context: ./runit/challenge
      dockerfile: Dockerfile
    container_name: challenge-runit
    restart: always
    ports:
      - "5252:5252"
    networks:
      - challenge-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  runitplusplus:
    build:
      context: ./runitplusplus/challenge
      dockerfile: Dockerfile
    container_name: challenge-runitplusplus
    restart: always
    ports:
      - "5253:5253"
    networks:
      - challenge-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  genius:
    build:
      context: ./genius/challenge
      dockerfile: Dockerfile
    container_name: challenge-genius
    restart: always
    ports:
      - "5254:5254"
    networks:
      - challenge-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  water-dragon:
    build:
      context: ./water-dragon/challenge
      dockerfile: Dockerfile
    container_name: challenge-water-dragon
    restart: always
    ports:
      - "2121:21"
    networks:
      - challenge-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  fastflag:
    build:
      context: ./fastflag/challenge
      dockerfile: Dockerfile
    container_name: challenge-fastflag
    restart: always
    ports:
      - "5255:5255"
    networks:
      - challenge-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  straw-clutcher:
    build:
      context: ./straw-clutcher/challenge
      dockerfile: Dockerfile
    container_name: challenge-straw-clutcher
    restart: always
    ports:
      - "5256:5256"
    networks:
      - challenge-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  slowfire:
    build:
      context: ./slowfire/challenge
      dockerfile: Dockerfile
    container_name: challenge-slowfire
    restart: always
    ports:
      - "5257:5257"
    networks:
      - challenge-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ============================================
  # CRYPTOGRAPHY CHALLENGES
  # ============================================

  crust:
    build:
      context: ./crust/challenge
      dockerfile: Dockerfile
    container_name: challenge-crust
    restart: always
    ports:
      - "5300:53/udp"
      - "5300:53/tcp"
    networks:
      - challenge-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  decrypto:
    build:
      context: ./decrypto/challenge
      dockerfile: Dockerfile
    container_name: challenge-decrypto
    restart: always
    ports:
      - "5258:5258"
    networks:
      - challenge-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  rsaos:
    build:
      context: ./rsaos/challenge
      dockerfile: Dockerfile
    container_name: challenge-rsaos
    restart: always
    ports:
      - "5259:5259"
    networks:
      - challenge-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ============================================
  # WEB CHALLENGES
  # ============================================

  cloud2clown:
    build:
      context: ./cloud2clown
      dockerfile: Dockerfile
    container_name: challenge-cloud2clown
    restart: always
    ports:
      - "8081:8080"
    networks:
      - challenge-network
    security_opt:
      - no-new-privileges:true

  kookie:
    build:
      context: ./kookie
      dockerfile: Dockerfile
    container_name: challenge-kookie
    restart: always
    ports:
      - "4455:4455"
    networks:
      - challenge-network
    security_opt:
      - no-new-privileges:true

  pick-tac-toe:
    build:
      context: ./pick-tac-toe
      dockerfile: Dockerfile
    container_name: challenge-pick-tac-toe
    restart: always
    ports:
      - "8888:8888"
    networks:
      - challenge-network
    security_opt:
      - no-new-privileges:true

  mixer:
    build:
      context: ./mixer
      dockerfile: Dockerfile
    container_name: challenge-mixer
    restart: always
    ports:
      - "9292:9292"
    networks:
      - challenge-network
    security_opt:
      - no-new-privileges:true

  futurella:
    build:
      context: ./futurella
      dockerfile: Dockerfile
    container_name: challenge-futurella
    restart: always
    ports:
      - "5001:5000"
    networks:
      - challenge-network
    security_opt:
      - no-new-privileges:true

  flagsrv:
    build:
      context: ./flagsrv
      dockerfile: Dockerfile
    container_name: challenge-flagsrv
    restart: always
    ports:
      - "3001:3000"
    networks:
      - challenge-network
    security_opt:
      - no-new-privileges:true

  mainframe:
    build:
      context: ./mainframe
      dockerfile: Dockerfile
    container_name: challenge-mainframe
    restart: always
    ports:
      - "8002:8000"
    networks:
      - challenge-network
    security_opt:
      - no-new-privileges:true

  pythia:
    build:
      context: ./pythia
      dockerfile: Dockerfile
    container_name: challenge-pythia
    restart: always
    ports:
      - "5002:5001"
    networks:
      - challenge-network
    security_opt:
      - no-new-privileges:true

# ============================================
# NETWORKS
# ============================================

networks:
  ctf-network:
    driver: bridge
  challenge-network:
    driver: bridge
    internal: false

# ============================================
# VOLUMES
# ============================================

volumes:
  mysql_data:
  ctfd_logs:
  ctfd_uploads:
